<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoply | Seller Dashboard</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <header class="top-bar">
    <a class="logo" href="index.html">Shoply</a>
  </header>
  <nav class="nav" data-nav></nav>

  <main class="page">
    <div class="section-head">
      <div>
        <h1 class="page-title">My Products</h1>
        <p class="muted">Add, edit, and manage your product listings.</p>
      </div>
    </div>

    <form class="form-card" data-product-form>
      <h2>Add Product</h2>
      <div class="form-grid">
        <div class="form-row"><label for="name">Name</label><input id="name" name="name" required></div>
        <div class="form-row"><label for="description">Description</label><textarea id="description" name="description" rows="3" required></textarea></div>
        <div class="form-row"><label for="price">Price</label><input id="price" name="price" type="number" min="0" step="0.01" required></div>
        <div class="form-row"><label for="category">Category</label><input id="category" name="category" required></div>
        <div class="form-row"><label for="image">Image URL</label><input id="image" name="image" type="url" required></div>
        <div class="form-row"><label for="stock">Stock Quantity</label><input id="stock" name="stock" type="number" min="0" step="1" required></div>
        <div class="actions">
          <button class="button" type="submit">Save Product</button>
          <button class="button secondary" type="button" data-reset-product>Clear</button>
        </div>
      </div>
    </form>

    <section class="table-card" data-seller-products></section>
  </main>

  <script src="script.js"></script>
  <script src="seller.js"></script>
</body>
</html>
