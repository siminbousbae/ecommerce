<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoply | Sales Stats</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <header class="top-bar">
    <a class="logo" href="index.html">Shoply</a>
  </header>
  <nav class="nav" data-nav></nav>

  <main class="page">
    <div class="section-head">
      <div>
        <h1 class="page-title">Sales Statistics</h1>
        <p class="muted">Track revenue, orders, and best sellers.</p>
      </div>
      <select data-date-filter aria-label="Date filter">
        <option value="7">Last 7 Days</option>
        <option value="30">Last 30 Days</option>
        <option value="all">All Time</option>
      </select>
    </div>
    <section data-seller-stats></section>
  </main>

  <script src="script.js"></script>
  <script src="seller.js"></script>
</body>
</html>
