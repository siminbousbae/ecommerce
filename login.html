<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoply | Login</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <header class="top-bar">
    <a class="logo" href="index.html">Shoply</a>
  </header>
  <nav class="nav" data-nav></nav>

  <main class="form-card">
    <h1 class="page-title">Login</h1>
    <p class="muted">Use admin@shoply.com / admin123 for the built-in admin account.</p>
    <form class="form-grid" data-login-form>
      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
      </div>
      <button class="button" type="submit">Login</button>
    </form>
    <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
  </main>

  <script src="script.js"></script>
  <script src="auth.js"></script>
</body>
</html>
