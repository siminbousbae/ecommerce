<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoply | Register</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <header class="top-bar">
    <a class="logo" href="index.html">Shoply</a>
  </header>
  <nav class="nav" data-nav></nav>

  <main class="form-card">
    <h1 class="page-title">Create Account</h1>
    <form class="form-grid" data-register-form>
      <div class="form-row">
        <label for="name">Full Name</label>
        <input id="name" name="name" type="text" required>
      </div>
      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="6" required>
      </div>
      <div class="form-row">
        <label for="confirm">Confirm Password</label>
        <input id="confirm" name="confirm" type="password" minlength="6" required>
      </div>
      <div class="form-row">
        <label>Role</label>
        <div class="radio-group">
          <label><input type="radio" name="role" value="buyer" required> Buyer</label>
          <label><input type="radio" name="role" value="seller" required> Seller</label>
        </div>
      </div>
      <button class="button" type="submit">Register</button>
    </form>
    <p class="auth-switch">Already registered? <a href="login.html">Login</a></p>
  </main>

  <script src="script.js"></script>
  <script src="auth.js"></script>
</body>
</html>
